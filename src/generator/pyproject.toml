[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ponni-kokkos-nn"
version = "0.1.0"
description = "Ahead-of-time ONNX to Kokkos compiler for PONNI"
requires-python = ">=3.10"
dependencies = ["numpy", "onnx", "onnxruntime", "onnxscript", "torch", "keras", "tensorflow", "tf2onnx"]

[project.optional-dependencies]
exact = ["ortools>=9.10"]

[project.scripts]
kokkos-nn = "kokkos_nn.cli:main"

[tool.setuptools]
packages = ["kokkos_nn"]
